name: VisionGuard CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-app.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-app.txt
          pip install ruff pytest

      - name: Lint (syntax errors and undefined names)
        run: ruff check --select E9,F63,F7,F82 .

      - name: Run tests
        run: pytest -v tests

  docker-build:
    needs: lint-and-test
    runs-on: ubuntu-latest
    env:                                   # values come from GitHub Secrets, never written here
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download Linux wheels for the image
        run: pip download -r requirements-app.txt -d wheels --only-binary=:all:

      - name: Fetch champion model from the MLflow registry
        run: |
          pip install mlflow-skinny python-dotenv
          python fetchmodel.py

      - name: Build Docker image
        run: docker build -t visionguard:ci .

      - name: Smoke test (container must become healthy)
        run: |
          docker run -d --name vg -p 8000:8000 visionguard:ci
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8000/health; then echo; echo "healthy"; exit 0; fi
            sleep 5
          done
          docker logs vg
          exit 1