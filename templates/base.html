<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VisionGuard - {% block title %}{% endblock %}</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 0; background: #f4f6f8; color: #1f2933; }
        header { background: #1f2933; color: #fff; padding: 14px 24px; display: flex; gap: 24px; align-items: center; }
        header a { color: #cbd2d9; text-decoration: none; } header a:hover { color: #fff; }
        header strong { font-size: 1.2rem; margin-right: auto; }
        main { max-width: 860px; margin: 32px auto; padding: 0 16px; }
        .card { background: #fff; border-radius: 10px; padding: 24px 28px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
        button { background: #2563eb; color: #fff; border: 0; padding: 10px 22px; border-radius: 6px; font-size: 1rem; cursor: pointer; }
        .muted { color: #616e7c; font-size: .9rem; }
        .verdict { font-size: 2rem; font-weight: 700; margin: 8px 0; }
        .ai { color: #b91c1c; } .real { color: #15803d; }
        .caveat { background: #fff7e6; border-left: 4px solid #f59e0b; padding: 12px 16px; margin-top: 20px; }
        .error { border-left: 6px solid #dc2626; }
        table { width: 100%; border-collapse: collapse; font-size: .9rem; }
        th, td { padding: 8px; border-bottom: 1px solid #e4e7eb; text-align: left; }
        .rejected { color: #b91c1c; }
    </style>
</head>
<body>
    <header>
        <strong>VisionGuard</strong>
        <a href="{{ url_for('index') }}">Upload</a>
        <a href="{{ url_for('history') }}">History</a>
        <a href="{{ url_for('health') }}">Health</a>
    </header>
    <main>{% block content %}{% endblock %}</main>
</body>
</html>
