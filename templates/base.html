<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VisionGuard - {% block title %}{% endblock %}</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 0; background: #f4f6f8; color: #1f2933; }
        header { background: #1f2933; color: #fff; padding: 14px 24px; display: flex; gap: 24px; align-items: center; }
        header a { color: #cbd2d9; text-decoration: none; } header a:hover { color: #fff; }
        header strong { font-size: 1.2rem; margin-right: auto; }
        main { max-width: 860px; margin: 32px auto; padding: 0 16px; }
        .card { width: 100%;background: #fff; border-radius: 10px; padding: 24px 28px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
        button { background: #2563eb; color: #fff; border: 0; padding: 10px 22px; border-radius: 6px; font-size: 1rem; cursor: pointer; }
        .muted { color: #616e7c; font-size: .9rem; }
        .verdict { font-size: 2rem; font-weight: 700; margin: 8px 0; }
        .ai { color: #b91c1c; } .real { color: #15803d; }
        .caveat { background: #fff7e6; border-left: 4px solid #f59e0b; padding: 12px 16px; margin-top: 20px; }
        .error { border-left: 6px solid #dc2626; }
        table { width: 100%; border-collapse: collapse; font-size: .9rem; }
        th, td { padding: 8px; border-bottom: 1px solid #e4e7eb; text-align: left; }
        .rejected { color: #b91c1c; }
                /* ---- history page (Task 5) ---- */
        main.wide { max-width: 1200px; }
        .card { overflow: hidden; }
        .table-wrap { width: 100%; overflow-x: auto; }
        .table-wrap table { min-width: 760px; }
        td, th { word-break: break-word; vertical-align: top; }
        td.file { max-width: 220px; }
        td .muted { font-size: .8rem; }
        .stats { display: flex; gap: 12px; flex-wrap: wrap; margin: 16px 0 20px; }
        .stat { flex: 1; min-width: 110px; background: #f8fafc; border: 1px solid #e4e7eb; border-radius: 8px; padding: 10px 12px; }
        .stat b { display: block; font-size: 1.4rem; }
        .filters { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .filters select { padding: 6px 10px; border-radius: 6px; border: 1px solid #cbd2d9; }
        .badge { padding: 3px 10px; border-radius: 999px; font-size: .8rem; font-weight: 600; white-space: nowrap; }
        .badge.ai { background: #fdecec; color: #b91c1c; }
        .badge.real { background: #e9f9ef; color: #15803d; }
        .badge.bad { background: #f1f5f9; color: #b91c1c; }
    </style>
</head>
<body>
    <header>
        <strong>VisionGuard</strong>
        <a href="{{ url_for('index') }}">Upload</a>
        <a href="{{ url_for('history') }}">History</a>
        <a href="{{ url_for('health') }}">Health</a>
    </header>
    <main class="{% block main_class %}{% endblock %}">{% block content %}{% endblock %}</main></body>
</html>
